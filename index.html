<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F6F2">
<title>IO NATALL&amp;A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="IO NATALL&A — contemporary painter in Tallinn, Estonia. Original paintings in series, available to collect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400&display=swap">
<style>
/* Layout: after brandonyasin.com — a 4-column grid on a warm paper ground, one neo-grotesk at thin/regular weights,
   lowercase display titles, 12px uppercase labels, images bottom-aligned, almost no chrome.
   One deliberate light look (the reference is single-theme). */
:root{
  --bg:#F8F6F2; --ink:#111111; --mute:#77736A; --line:#D9D4C9; --soft:#EEEAE2;
  --veil:#2E2B25; --sage:#C9A1A6; --moss:#2A1233;
  --f:"Hanken Grotesk","Neue Haas Unica","Helvetica Neue",Helvetica,Arial,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  --gap:8px; --col:calc((100vw - var(--gl) - var(--gr) - 3*var(--gap)) / 4);
  --disp:clamp(46px, 6.26vw, 90px); --lead:clamp(19px, 1.67vw, 24px);
  --ease:cubic-bezier(.645,.045,.355,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f);font-weight:400;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
::selection{background:#44300033;color:var(--ink)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:none;background:var(--ink);color:var(--bg)}
img:focus-visible,.card:focus-visible{background:none;outline:2px solid var(--ink);outline-offset:3px}
.cap{font-size:12px;line-height:1.25;text-transform:uppercase;letter-spacing:.01em}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.disp{font-size:var(--disp);line-height:.98;letter-spacing:-.04em;font-weight:400;text-transform:lowercase;margin:0;text-wrap:balance}
.lead{font-size:var(--lead);line-height:1.2;font-weight:300;letter-spacing:-.01em}
.lead p{margin:0 0 1em}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);padding-left:var(--gl);padding-right:var(--gr)}
.grid>*{min-width:0}
.c1{grid-column:1}.c2{grid-column:2}.c3{grid-column:3}.c4{grid-column:4}
.c12{grid-column:1/span 2}.c23{grid-column:2/span 2}.c34{grid-column:3/span 2}.c24{grid-column:2/span 3}.c14{grid-column:1/-1}
.ul{background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-repeat:no-repeat;background-position:0 100%;padding-bottom:1px}
.hov{background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .35s var(--ease)}
.hov:hover{background-size:100% 1px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:48px;padding:0 14px;border:1px solid var(--ink);font-size:12px;text-transform:uppercase;transition:background .25s,color .25s}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:#2C2A26}
.btn[disabled]{opacity:.4;cursor:default;background:none;color:var(--ink)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* header — four columns like the reference; no clock */
.hd{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:40;padding-top:14px;padding-bottom:14px;align-items:start;transition:background .3s}
.hd.solid{background:var(--bg)}
.hd .name{line-height:1.25}
.hd .sig{width:clamp(210px,21vw,312px);height:auto;margin-top:-10px;opacity:.9}
.hd .stack{display:grid;justify-items:start;gap:0;line-height:1.25}
.hd .stack button,.hd .stack a{line-height:1.25}
.hd .cart{display:grid;justify-items:start;line-height:1.25}
.hd .cart .n{letter-spacing:.06em}
.hd .flip{display:inline-grid;overflow:hidden;height:1.25em}
.hd .flip span{grid-area:1/1;transition:transform .35s var(--ease)}
.hd .flip span+span{transform:translateY(105%)}
.hd button:hover .flip span:first-child,.hd a:hover .flip span:first-child{transform:translateY(-105%)}
.hd button:hover .flip span+span,.hd a:hover .flip span+span{transform:translateY(0)}

/* views */
.view{display:none}.view.on{display:block;animation:vin .55s var(--ease)}
@keyframes vin{from{opacity:0}to{opacity:1}}

/* HOME — endless horizontal strip of series, bottom-aligned, drag or wheel */
#v-home.on{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
.intro{position:absolute;top:calc(env(safe-area-inset-top,0px) + 132px);left:0;right:0}
.strip{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:calc(var(--cw) * 1.322 + 24px);--cw:clamp(250px, 27.57vw, 560px);cursor:grab;user-select:none;-webkit-user-select:none}
.strip.drag{cursor:grabbing}
.card{position:absolute;left:0;bottom:0;width:var(--cw);display:grid;gap:8px;will-change:transform}
.card .t{display:flex;justify-content:space-between;gap:12px;transition:transform .5s var(--ease)}
.card .im{aspect-ratio:3/4;overflow:hidden;background:var(--soft);transition:transform .5s var(--ease)}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.card .t .k{opacity:0;transition:opacity .35s}
.card:hover .t,.card:hover .im{transform:translateY(-8px)}
.card:hover .t .k{opacity:1}
.cursor{position:fixed;left:0;top:0;z-index:45;width:76px;height:76px;margin:-38px 0 0 -38px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s var(--ease)}
.cursor.on{opacity:1;transform:scale(1)}
@media (hover:none){.cursor{display:none}}

/* page heads */
.pagehead{padding-top:calc(env(safe-area-inset-top,0px) + 112px);align-items:end}
.pad{height:clamp(80px,12vw,180px)}

/* SERIES */
.shero{min-height:100svh;align-items:end;padding-top:calc(env(safe-area-inset-top,0px) + 60px);padding-bottom:16px;row-gap:24px}
.shero .ttl{grid-column:1/span 2;align-self:end;display:grid;gap:36px}
.shero .meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.shero .pic{grid-column:3/span 2;grid-row:1;align-self:stretch;min-height:min(78svh,824px);overflow:hidden;background:var(--soft);cursor:zoom-in}
.shero .pic img{width:100%;height:100%;object-fit:cover}
.about-s{padding-top:clamp(80px,10vw,160px);padding-bottom:clamp(60px,8vw,120px);row-gap:28px}
.facts{display:grid;gap:0}
.facts>div{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:12px 0;border-top:1px solid var(--line)}
.facts>div:last-child{border-bottom:1px solid var(--line)}
.acts{display:grid;gap:var(--gap);margin-top:20px}
.works{display:grid;gap:clamp(80px,10vw,160px);padding-bottom:clamp(80px,10vw,160px)}
.wk{row-gap:12px}
.wk .im{display:block;cursor:pointer}
.wk .im img{width:100%;height:auto;max-height:86svh;object-fit:contain;object-position:left bottom}
.wk.p0 .im,.wk.p0 .wc{grid-column:2/span 2}
.wk.p1 .im,.wk.p1 .wc{grid-column:1/span 2}
.wk.p2 .im,.wk.p2 .wc{grid-column:3/span 2}
.wk .wc{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.wk .wc .r{display:grid;gap:2px}
.next{display:block;border-top:1px solid var(--line);padding:16px var(--gr) 16px var(--gl)}
.next .grid{padding:0;align-items:end}
.next .thumb{grid-column:4;justify-self:end;width:min(100%,272px);aspect-ratio:272/313;overflow:hidden}
.next .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.next:hover .thumb img{transform:scale(1.04)}

/* ARTWORK */
.ahero{min-height:100svh;align-items:end;padding-top:calc(env(safe-area-inset-top,0px) + 60px);padding-bottom:16px;row-gap:24px}
.ahero .ttl{grid-column:1/span 2;display:grid;gap:28px;align-self:end}
.ahero .ttl .disp{font-size:clamp(40px,5.2vw,80px)}
.ahero .pic{grid-column:3/span 2;grid-row:1;align-self:end;display:flex;align-items:flex-end;justify-content:flex-start;cursor:zoom-in}
.ahero .pic img{max-height:calc(100svh - 92px);width:auto;max-width:100%}
.spec{padding-top:clamp(70px,9vw,140px);row-gap:28px}
.spec .rows{display:grid}
.spec .rows>div{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:10px 0;border-top:1px solid var(--line);font-size:var(--lead);font-weight:300;letter-spacing:-.01em}
.spec .rows>div:last-child{border-bottom:1px solid var(--line)}
.spec .rows dt{color:var(--mute)}
.spec .rows dd{margin:0}
.frag{padding-top:clamp(60px,8vw,120px);row-gap:12px}
.frag .im{overflow:hidden;aspect-ratio:3/4;background:var(--soft);cursor:zoom-in}
.frag .im img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.frag .im:hover img{transform:scale(1.03)}
.pn{display:flex;justify-content:space-between;gap:16px}

/* ARTWORKS — archive strip + index */
#v-artworks.on.isstrip{position:fixed;inset:0;overflow:hidden}
.ahead{position:relative;z-index:2}
.toggle{display:flex;gap:16px;margin-top:22px}
.toggle button{color:var(--mute)}
.toggle button[aria-pressed="true"]{color:var(--ink)}
.astrip{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-left:var(--gl);padding-right:var(--gr)}
.astrip::-webkit-scrollbar{display:none}
.astrip .row{display:flex;gap:var(--gap);align-items:flex-end;width:max-content}
.astrip a{display:grid;gap:8px;flex:none}
.astrip a img{height:clamp(200px,30svh,330px);width:auto;transition:transform .5s var(--ease)}
.astrip a .cap{opacity:0;transform:translateY(4px);transition:opacity .3s,transform .4s var(--ease);white-space:nowrap}
.astrip a:hover img{transform:translateY(-8px)}
.astrip a:hover .cap,.astrip a:focus-visible .cap{opacity:1;transform:none}
.index{padding-top:clamp(50px,6vw,90px);padding-bottom:clamp(80px,10vw,160px)}
.filters{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:28px}
.filters button{color:var(--mute)}
.filters button[aria-pressed="true"]{color:var(--ink)}
.irow{display:grid;grid-template-columns:44px minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.irow:last-child{border-bottom:1px solid var(--line)}
.irow img{width:44px;height:44px;object-fit:cover}
.irow .t{font-size:var(--lead);font-weight:300;letter-spacing:-.01em}
.irow:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* ABOUT */
.ab-head{padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
.ab-head .disp{grid-column:1/span 3}
.ab-intro{padding-top:clamp(70px,9vw,140px);row-gap:36px;align-items:start}
.fade{position:relative;aspect-ratio:295/371;overflow:hidden;background:var(--soft)}
.fade img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.fade img.on{opacity:1}
.nlist{list-style:none;margin:40px 0 0;padding:0;display:grid}
.nlist li{display:grid;grid-template-columns:3.2em 1fr;font-size:var(--lead);font-weight:300;letter-spacing:-.01em;padding:4px 0}
.themes{padding-top:clamp(100px,13vw,200px);row-gap:clamp(40px,5vw,72px)}
.theme{display:grid;gap:12px}
.theme .im{position:relative;aspect-ratio:397/496;overflow:hidden}
.theme .im img{width:100%;height:100%;object-fit:cover}
.theme .im .w{position:absolute;left:12px;bottom:10px;font-size:clamp(24px,2.5vw,38px);letter-spacing:-.04em;color:#F8F6F2;text-shadow:0 1px 18px rgba(0,0,0,.35);text-transform:lowercase;line-height:1}
.process{padding-top:clamp(100px,13vw,200px);align-items:start;row-gap:40px}
.process .stick{position:sticky;top:110px}
.steps{display:grid;gap:clamp(60px,9vw,140px)}
.step{display:grid;gap:14px}
.step img{width:100%;aspect-ratio:4/3;object-fit:cover}
.quote{padding-top:clamp(100px,13vw,200px)}
.contact{padding-top:clamp(100px,13vw,200px);padding-bottom:clamp(80px,10vw,160px);row-gap:28px}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.crow:last-child{border-bottom:1px solid var(--line)}
.crow .v{font-size:var(--lead);font-weight:300;letter-spacing:-.01em;overflow-wrap:anywhere}
.copy{margin-left:10px;font-size:12px;text-transform:uppercase;color:var(--mute)}
.copy:hover{color:var(--ink)}

/* LEGAL */
.lnav{display:grid;gap:4px;align-content:start;position:sticky;top:110px}
.lnav a{color:var(--mute)}
.lnav a.on,.lnav a:hover{color:var(--ink)}
.lbody{display:grid;gap:30px;max-width:66ch}
.lbody h3{margin:0 0 8px;font-weight:400}
.lt{font-size:16px;line-height:1.55;font-weight:300}
.lt a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lt ol,.lt ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.formbox{border:1px solid var(--line);padding:18px;font-size:15px}
.todo{background:#EBDD9A;padding:0 3px}

/* footer */
.ft{padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:0;row-gap:24px}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ft a:hover{color:var(--mute)}

/* MENU — the page steps back into a row of page tiles */
.menu{position:fixed;inset:0;z-index:70;background:var(--veil);display:grid;align-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 56px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.menu .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:var(--gr);color:var(--bg)}
.menu .lbl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:var(--gl);color:var(--bg)}
.tiles{display:flex;gap:clamp(16px,2.6vw,40px);overflow-x:auto;scrollbar-width:none;padding-left:max(var(--gl),calc((100vw - 4*min(22vw,330px) - 3*clamp(16px,2.6vw,40px))/2));padding-right:var(--gr);scroll-snap-type:x mandatory}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:min(22vw,330px);aspect-ratio:9/15;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr;padding:10px;gap:14px;scroll-snap-align:center;opacity:0;transform:translateY(40px) scale(.96);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.menu.in .tile{opacity:1;transform:none}
.menu.in .tile:nth-child(2){transition-delay:.06s}.menu.in .tile:nth-child(3){transition-delay:.12s}.menu.in .tile:nth-child(4){transition-delay:.18s}
.tile .mh{display:flex;justify-content:space-between;align-items:start;font-size:8px;line-height:1.2;text-transform:uppercase}
.tile .mh img{width:44px}
.tile .tt{font-size:clamp(26px,2.6vw,40px);letter-spacing:-.04em;line-height:1;text-transform:lowercase}
.tile .pics{align-self:end;display:flex;gap:4px;align-items:flex-end}
.tile .pics img{flex:1 1 0;min-width:0;height:auto;aspect-ratio:3/4;object-fit:cover}
.tile .txt{align-self:end;font-size:11px;line-height:1.3;text-transform:uppercase;display:grid;gap:3px}
.tile:hover{transform:translateY(-8px)}
@media (max-width:767px){.tile{width:62vw}.tiles{padding-left:var(--gl)}}

/* CONTACT / PURCHASE panel — dusty rose paper, deep plum ink, ruled rows */
.modal{position:fixed;inset:0;z-index:80;background:rgba(28,14,30,.55);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 56px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 56px) var(--gl);opacity:0;transition:opacity .35s}
.modal.in{opacity:1}
.panel{--ink:var(--moss);color:var(--moss);background:var(--sage);max-width:1003px;margin:0 auto;padding:24px 24px 28px;transform:translateY(30px);transition:transform .55s var(--ease);position:relative}
.modal.in .panel{transform:none}
.panel ::selection{background:#2A123326}
.panel :focus-visible{background:var(--moss);color:var(--sage)}
.ptop{display:flex;justify-content:space-between;align-items:start;gap:20px}
.tabs{display:flex;gap:28px;font-size:var(--lead);font-weight:300;position:relative}
.tabs button{opacity:.55;padding-bottom:3px}
.tabs button[aria-selected="true"]{opacity:1;box-shadow:inset 0 -1px 0 currentColor}
.pclose{font-size:12px;text-transform:uppercase}
.phead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:end;margin-top:44px;padding-bottom:56px}
.phead h2{font-size:var(--disp);font-weight:200;letter-spacing:-.04em;line-height:.98;margin:0;text-wrap:balance}
.phead p{margin:0 0 .9em;max-width:30ch}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:24px;border-top:1px solid var(--moss);padding:12px 0 22px}
.prow .lab{grid-column:2}
.prow .fld{grid-column:3;display:grid;gap:6px;min-width:0}
.prow.wide .fld{grid-column:2/span 2}
.prow .pintro{grid-column:1;grid-row:1}
.panel input[type=text],.panel input[type=email],.panel input[type=tel],.panel textarea,.panel select{font:inherit;font-size:16px;color:var(--moss);background:transparent;border:0;border-bottom:1px solid rgba(42,18,51,.35);padding:4px 0 6px;width:100%;border-radius:0}
.panel textarea{resize:vertical;min-height:72px}
.panel input::placeholder,.panel textarea::placeholder{color:rgba(42,18,51,.5)}
.panel input:focus,.panel textarea:focus,.panel select:focus{outline:none;border-bottom-color:var(--moss)}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.3}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:14px;height:14px;border:1px solid var(--moss);margin-top:2px;position:relative}
.chk .box::after{content:"";position:absolute;inset:-1px;background:var(--moss);transform:scale(0);transition:transform .2s ease-out}
.chk input:checked+.box::after{transform:scale(1)}
.chk.radio .box{border-radius:50%}.chk.radio .box::after{border-radius:50%}
.chk input:focus-visible+.box{outline:2px solid var(--moss);outline-offset:2px}
.chk .s{opacity:.7;font-size:13px}
.ci{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.ci img{width:44px;height:44px;object-fit:cover}
.ci .rm{font-size:12px;text-transform:uppercase;opacity:.7}
.ci .rm:hover{opacity:1}
.psub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:24px;border-top:1px solid var(--moss);padding-top:14px}
.psub .fld{grid-column:2/span 2;display:grid;gap:14px}
.psub .btn{border-color:var(--moss);color:var(--moss)}
.psub .btn:hover,.psub .btn.solid{background:var(--moss);color:#F3E6E8}
.err{font-size:14px;margin:0}
.done{display:grid;gap:18px;padding-top:8px}
.done pre{white-space:pre-wrap;font-family:var(--f);font-size:14px;line-height:1.45;margin:0;max-height:260px;overflow:auto;border:1px solid rgba(42,18,51,.4);padding:14px}
.prow .crow{border-color:rgba(42,18,51,.35)}
@media (max-width:767px){
  .phead{grid-template-columns:1fr;margin-top:32px;padding-bottom:36px}
  .prow,.psub{grid-template-columns:1fr;gap:10px}
  .prow .lab,.prow .fld,.prow.wide .fld,.psub .fld{grid-column:1}
  .prow .pintro{display:none}
  .panel{padding:18px 16px 22px}
  .tabs{gap:18px}
}

/* lightbox + toast */
.lb{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 50px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gl);cursor:zoom-out}
.lb img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:var(--gr)}
.toast{position:fixed;left:var(--gl);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--ink);color:var(--bg);padding:12px 14px;display:flex;gap:18px;align-items:center;max-width:calc(100vw - 32px)}

/* ---------- settings ---------- */
const SHOW_PRICES = false;              /* true shows euro prices from the catalogue */
const PRICE_TEXT = "Price upon request";
const FORM_ENDPOINT = "https://formsubmit.co/ajax/" + ARTIST_EMAIL;
const LINKS = {insta:"https://www.instagram.com/io_natalla/", behance:"https://www.behance.net/io_natalla", laguna:"https://artelaguna.world/artist/kossareva-natalja/"};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const eur=n=>"€"+Number(n).toLocaleString("en-US");
const WORKS=[], BY_W={}, BY_S={};
SERIES.forEach(s=>{BY_S[s.id]=s; s.works.forEach((w,i)=>{w.s=s; w.i=i; WORKS.push(w); BY_W[w.id]=w;});});
const nCanv=s=>s.diptychOneImage?2:s.works.length;
const size=s=>`${s.w} × ${s.h} cm`;
const unit=s=>s.kind.startsWith("Series")?"series":s.kind.toLowerCase();
const soldAsSet=s=>!!s.price && s.works.every(w=>!w.price);
function priceOf(w){ const s=w.s; if(!SHOW_PRICES||s.onRequest) return PRICE_TEXT; if(w.price) return eur(w.price); if(s.price) return eur(s.price)+" · complete "+unit(s); return PRICE_TEXT; }
function seriesPrice(s){ if(!SHOW_PRICES||s.onRequest) return PRICE_TEXT; if(s.price) return eur(s.price)+" · complete "+unit(s); return s.works.map(w=>w.price?eur(w.price):PRICE_TEXT).join(" / "); }
const img=(id,small)=>`img/${id}${small?"-s":""}.jpg`;
const roman=w=>w.n?w.n:"";
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
let toastT;
function toast(msg, actLabel, act){ const t=$("#toast"); t.innerHTML=`<span>${esc(msg)}</span>${actLabel?`<button>${esc(actLabel)}</button>`:""}`; t.hidden=false; if(act) $("button",t).onclick=()=>{t.hidden=true;act();}; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,4200); }
function copyText(text,btn){ const ok=()=>{ if(btn){const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>btn.textContent=o,1400);} };
  try{ navigator.clipboard.writeText(text).then(ok,()=>toast("Select the text to copy it")); }catch(e){ toast("Select the text to copy it"); } }
function footer(){ return `<footer class="ft grid cap">
  <div class="c1"><div>IO NATALL&amp;A © 2026</div><div class="mute">Tallinn, Estonia</div></div>
  <ul class="c2"><li><a href="#home" data-go="home">Series</a></li><li><a href="#artworks" data-go="artworks">Artworks</a></li><li><a href="#about" data-go="about">About</a></li></ul>
  <ul class="c3"><li><a href="#shipping" data-go="shipping">Shipping &amp; returns</a></li><li><a href="#terms" data-go="terms">Terms of sale</a></li><li><a href="#privacy" data-go="privacy">Privacy</a></li></ul>
  <ul class="c4"><li><a href="${LINKS.insta}" target="_blank" rel="noopener">Instagram</a></li><li><a href="${LINKS.behance}" target="_blank" rel="noopener">Behance</a></li><li><button data-contact="email">Email</button></li></ul>
</footer>`; }

/* ---------- collection (cart) ---------- */
let cart = (store("ion_cart")||[]).filter(c=>c.t==="work"?BY_W[c.id]:BY_S[c.id]);
function saveCart(){ store("ion_cart",cart); $("#cartN").textContent=pad(cart.length); }
function inCart(t,id){ return cart.some(c=>c.t===t&&c.id===id); }
function addToCart(t,id){
  if(!inCart(t,id)){ if(t==="series") cart=cart.filter(c=>!(c.t==="work"&&BY_W[c.id].s.id===id)); cart.push({t,id}); saveCart(); }
  const name = t==="work"?BY_W[id].title:BY_S[id].title;
  toast(`${name} is in your collection`,"Send request",()=>openPanel("purchase"));
  if(route.startsWith("work-")||route.startsWith("series-")) go(route,false,true);
}
const cartItem=c=>c.t==="work"?{title:BY_W[c.id].title, sub:`${BY_W[c.id].s.title} · ${size(BY_W[c.id].s)}`, im:BY_W[c.id].img}

/* ---------- HOME: endless strip ---------- */
let gal=null;
function buildHome(){
  $("#v-home").innerHTML = `
    <div class="intro grid cap"><div class="c3">Original paintings in series<br><span class="mute">Tallinn, 2025–2026</span></div></div>
    <div class="strip" id="strip">${SERIES.map((s,i)=>`<a class="card cap" href="#series-${s.id}" data-series="${s.id}" draggable="false">
      <span class="t"><span>${esc(s.title)}</span><span class="k mute num">${pad(nCanv(s))} works</span></span>
      <span class="im"><img src="${img(s.cover)}" alt="${esc(s.title)}" ${i>4?'loading="lazy"':""} draggable="false"></span></a>`).join("")}</div>`;
  initStrip();
}
function initStrip(){
  const el=$("#strip"), cards=$$(".card",el), n=cards.length;
  const st={x:0,tx:0,w:0,step:0,total:0,drag:false,sx:0,startX:0,moved:0,raf:0};
  const measure=()=>{ st.w=cards[0].offsetWidth; st.step=st.w+8; st.total=st.step*n; };
  measure();
  const gl=()=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gl"))||16;
  function render(){
    st.raf=requestAnimationFrame(render);
    if(route!=="home") return;
    if(cards[0].offsetWidth!==st.w) measure();
    if(!st.w) return;
    st.x +=(st.tx-st.x)*(matchMedia("(prefers-reduced-motion: reduce)").matches?1:.09);
    const off=gl();
    cards.forEach((c,i)=>{ let p=((i*st.step+st.x)%st.total+st.total)%st.total; if(p>st.total-st.step) p-=st.total; c.style.transform=`translate3d(${p+off}px,0,0)`; });
  }
  cancelAnimationFrame(gal&&gal.raf); gal=st; render();
  const onWheel=e=>{ if(route!=="home") return; e.preventDefault(); st.tx -= (Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.1; };
  window.removeEventListener("wheel", window._hw); window._hw=onWheel; window.addEventListener("wheel", onWheel, {passive:false});
  el.addEventListener("pointerdown",e=>{ st.drag=true; st.sx=e.clientX; st.startX=st.tx; st.moved=0; el.classList.add("drag"); });
  window.addEventListener("pointermove",e=>{ const cur=$("#cursor"); if(route==="home"){ cur.style.left=e.clientX+"px"; cur.style.top=e.clientY+"px"; }
    if(!st.drag) return; const d=e.clientX-st.sx; st.moved=Math.max(st.moved,Math.abs(d)); st.tx=st.startX+d*1.4; });
  window.addEventListener("pointerup",()=>{ st.drag=false; el.classList.remove("drag"); });
  el.addEventListener("click",e=>{ if(st.moved>6){ e.preventDefault(); e.stopPropagation(); } },true);
  el.addEventListener("pointerenter",()=>$("#cursor").classList.add("on"));
  el.addEventListener("pointerleave",()=>$("#cursor").classList.remove("on"));
  window.addEventListener("resize",measure);
  st.nudge=d=>{ st.tx+=d*st.step; };
}

      </div></section>${footer()}`}`;
  if(aView==="strip"){ const sEl=$("#astrip");
    sEl.addEventListener("wheel",e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ e.preventDefault(); sEl.scrollLeft+=e.deltaY; } },{passive:false});
    let down=false,sx=0,sl=0,moved=0;
    sEl.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse") return; down=true; sx=e.clientX; sl=sEl.scrollLeft; moved=0; });
    window.addEventListener("pointermove",e=>{ if(!down) return; moved=Math.max(moved,Math.abs(e.clientX-sx)); sEl.scrollLeft=sl-(e.clientX-sx); });
    window.addEventListener("pointerup",()=>down=false);
    sEl.addEventListener("click",e=>{ if(moved>6){ e.preventDefault(); e.stopPropagation(); } },true);
  }
}

async function deliver(subject, replyTo, name, text){

}

async function submitPurchase(f){

/* ---------- router ---------- */
let route="";
function show(id){ $$(".view").forEach(v=>v.classList.toggle("on",v.id===id)); }
function go(hash, push=true, keepScroll=false){
  hash=hash||"home"; route=hash; closeMenu();
  const y=scrollY;
  if(hash.startsWith("series-")&&BY_S[hash.slice(7)]){ renderSeries(hash.slice(7)); show("v-series"); document.title=BY_S[hash.slice(7)].title+" — IO NATALL&A"; }
  else if(hash.startsWith("work-")&&BY_W[hash.slice(5)]){ renderWork(hash.slice(5)); show("v-work"); document.title=BY_W[hash.slice(5)].title+" — IO NATALL&A"; }
  else if(hash==="artworks"){ renderArtworks(); show("v-artworks"); document.title="Artworks — IO NATALL&A"; }
  else if(hash==="about"){ renderAbout(); show("v-about"); document.title="About — IO NATALL&A"; }
  else if(["terms","privacy","shipping"].includes(hash)){ renderLegal(hash); show("v-legal"); document.title=LEGAL[hash].title+" — IO NATALL&A"; }
  else { route="home"; show("v-home"); document.title="IO NATALL&A"; }
  if(route!=="home") $("#cursor").classList.remove("on");
  if(push){ try{ history.replaceState(null,"","#"+route); }catch(e){} }
  window.scrollTo(0, keepScroll?y:0); onScroll();
}
function onScroll(){ $("#hd").classList.toggle("solid", route!=="home" && scrollY>40 && !(route==="artworks"&&aView==="strip")); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="modal"){ closePanel(); return; }
  if(e.target.id==="menu"){ closeMenu(); return; }
  if(e.target.closest("#lb")){ $("#lb").hidden=true; return; }
  const t=e.target.closest("a,button"); if(!t) return; const d=t.dataset;
  if(t.closest("#modal") && (d.go||d.work||d.series)) closePanel();
  if(d.work){ e.preventDefault(); go("work-"+d.work); return; }
  if(d.series){ e.preventDefault(); go("series-"+d.series); return; }
  if(d.go){ e.preventDefault(); go(d.go); return; }
  if(d.add){ const [ty,id]=d.add.split(":"); addToCart(ty,id); return; }
  if(d.ask){ openPanel("question",d.ask); return; }
  if(d.contact){ openPanel(d.contact); return; }
  if(d.tab){ pTab=d.tab; renderPanel(); $(`#modal [data-tab=${d.tab}]`).focus(); return; }
  if(d.rm!==undefined){ cart.splice(+d.rm,1); saveCart(); renderPanel(); return; }
  if(d.view){ aView=d.view; store("ion_view",aView); renderArtworks(); onScroll(); return; }
  if(d.filter){ aFilter=d.filter; renderArtworks(); return; }
  if(d.lb){ openLB(d.lb); return; }
  if(d.copy){ copyText(d.copy,t); return; }
  if(d.copyOut){ copyText($("#pOut").textContent,t.firstElementChild); return; }
  if(t.id==="menuBtn"){ openMenu(); return; }
  if(t.id==="menuX"){ closeMenu(); return; }
  if(t.id==="contactBtn"){ openPanel("question"); return; }
  if(t.id==="cartBtn"){ openPanel("purchase"); return; }
  if(t.id==="pClose"||t.id==="pClose2"){ closePanel(); return; }
});
document.addEventListener("submit",e=>{ e.preventDefault(); if(e.target.id==="pForm") submitPurchase(e.target); if(e.target.id==="qForm") submitQuestion(e.target); });

  if(e.key==="Escape"){ if(!$("#lb").hidden) $("#lb").hidden=true; else if(!$("#modal").hidden) closePanel(); else closeMenu(); return; }
  if(e.target.closest("input,textarea,select")) return;
  if(route==="home"&&gal&&(e.key==="ArrowRight"||e.key==="ArrowLeft")) gal.nudge(e.key==="ArrowRight"?-1:1);
  if(route.startsWith("work-")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){ const w=BY_W[route.slice(5)]; const n=w.s.works[w.i+(e.key==="ArrowRight"?1:-1)]; if(n) go("work-"+n.id); }
});
window.addEventListener("hashchange",()=>{ const h=(location.hash||"").slice(1); if(h==="contact") return openPanel("question"); if(h&&h!==route) go(h,false); });

buildHome(); saveCart();
(()=>{ const h=(location.hash||"").slice(1); if(h==="contact"){ go("home",false); openPanel("question"); } else go(h||"home",false); })();
</script>
