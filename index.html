<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>IO NATALL&amp;A Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="IO NATALL&A — contemporary painter based in Tallinn, Estonia. Original paintings in series, available to collect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;1,500&display=swap">
<style>
/* Layout: a gallery website — one geometric sans at a single weight, two-tone titles (black name, grey subtitle),
   generous white space, large images with captions underneath, a black band for collecting. One deliberate light look. */
:root{
  --bg:#FFFFFF; --ink:#000000; --grey:#6E6E6E; --soft:#F3F3F3; --line:#E2E2E2; --band:#000000;
  --f:"Albert Sans","Avenir Next","Avenir","Helvetica Neue",Arial,sans-serif;
  --gl:max(24px, env(safe-area-inset-left, 0px)); --gr:max(24px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-weight:500;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:65;background:var(--bg)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.g{color:var(--grey)}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:var(--gl);padding-right:var(--gr);max-width:1680px;margin:0 auto}
.h1{font-size:clamp(32px,3.6vw,48px);line-height:1.12;letter-spacing:-.005em;margin:0;font-weight:500;text-wrap:balance}
.h2{font-size:clamp(24px,2.3vw,32px);line-height:1.2;margin:0;font-weight:500}
.h3{font-size:clamp(18px,1.5vw,22px);line-height:1.3;margin:0;font-weight:500}
.lbl{font-size:13px;line-height:1.3}
.more{font-size:14px;display:inline-flex;gap:8px;align-items:center;border-bottom:1px solid currentColor;padding-bottom:2px}
.more:hover{color:var(--grey)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;font-size:15px;border:1px solid var(--ink);transition:background .2s,color .2s}
.btn.blk{background:var(--ink);color:#fff}
.btn.blk:hover{background:#2B2B2B}
.btn:not(.blk):hover{background:var(--soft)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.w{width:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
header.hd .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:76px}
.logo{font-size:24px;letter-spacing:.01em;white-space:nowrap}
nav.c4{display:flex;gap:clamp(18px,2.4vw,36px);align-items:center;font-size:15px}
nav.c4 a,nav.c4 button{position:relative}
nav.c4 a.on::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--ink)}
nav.c4 a:hover,nav.c4 button:hover{color:var(--grey)}
.menu-btn{display:none;font-size:15px}
@media (max-width:860px){nav.c4 .hm{display:none}.menu-btn{display:block}}
#mmenu{position:fixed;inset:0;z-index:70;background:var(--bg);padding:calc(100px + env(safe-area-inset-top,0px)) var(--gr) 40px var(--gl);display:grid;align-content:start;gap:18px}
#mmenu a,#mmenu button{font-size:34px;line-height:1.1}
#mmenu .x{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:var(--gr);font-size:15px}

.view{display:none}.view.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* home hero carousel */
.hero{padding-top:4px}
.stage{position:relative;aspect-ratio:16/8.4;max-height:78vh;width:100%;overflow:hidden;background:var(--soft)}
.stage .sl{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.stage .sl.on{opacity:1;z-index:1}
.stage img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 6s ease-out}
.stage .sl.on img{transform:scale(1)}
.cap{display:grid;grid-template-columns:1fr auto;gap:16px 32px;align-items:start;padding-top:22px}
.cap .lbl{margin-bottom:10px}
.cap .meta{font-size:clamp(17px,1.6vw,22px);margin-top:14px}
.cap .more{margin-top:18px}
.arrows{display:flex;gap:10px}
.arrows button{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:18px;color:#4D4D4D;transition:border-color .2s}
.arrows button:hover{border-color:var(--ink);color:var(--ink)}
.count{font-size:13px;color:var(--grey);text-align:right;margin-top:12px}

/* sections */
.sec{padding-block:clamp(64px,8vw,120px)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:28px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 22px}
.card{display:grid;gap:14px;align-content:start}
.card .im{aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.card:hover .im img{transform:scale(1.03)}
.card .tx{display:grid;gap:2px}
.card .tx .lbl{margin-bottom:6px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.band{background:var(--band);color:#fff}
.band .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;padding-block:clamp(70px,8vw,120px);align-items:end}
.band p{margin:18px 0 0;color:rgba(255,255,255,.75);max-width:52ch;font-size:17px}
.band .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.band .btn{border-color:#fff}
.band .btn.wht{background:#fff;color:#000}
.band .btn:not(.wht):hover{background:#1E1E1E}
@media (max-width:800px){.band .wrap{grid-template-columns:1fr}.band .acts{justify-content:flex-start}}
.works{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:60px 22px}
.wk{display:grid;gap:14px;align-content:start}
.wk .im{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;padding:12%}
.wk .im img{max-height:100%;width:auto;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 24px -12px rgba(0,0,0,.35);transition:transform .5s}
.wk:hover .im img{transform:translateY(-4px)}
.wk .tx{font-size:15px;line-height:1.4;display:grid;gap:1px}
.wk .tx .t{font-style:italic}
@media (max-width:1000px){.works{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.works{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 14px}.wk .tx{font-size:14px}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,90px);align-items:center}
.split img{width:100%;aspect-ratio:4/5;object-fit:cover}
.split p{font-size:18px;line-height:1.6;margin:22px 0 0;max-width:56ch}
@media (max-width:800px){.split{grid-template-columns:1fr}}

/* page heads + tabs */
.ph{padding-block:clamp(40px,5vw,80px) 30px}
.tabs{display:flex;flex-wrap:wrap;gap:8px 28px;border-bottom:1px solid var(--line);margin-bottom:44px;font-size:15px}
.tabs button{padding:12px 0;color:var(--grey);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button.on,.tabs button:hover{color:var(--ink);border-color:var(--ink)}

/* series page */
.sv-hero{aspect-ratio:16/8;max-height:80vh;background:var(--soft);overflow:hidden;margin-top:34px}
.sv-hero img{width:100%;height:100%;object-fit:cover}
.sv-text{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(30px,5vw,90px);padding-block:clamp(50px,6vw,90px)}
.sv-text .facts{display:grid;gap:14px;font-size:15px;align-content:start}
.sv-text .facts div{display:grid;gap:2px}
.sv-text .body p{font-size:clamp(18px,1.5vw,21px);line-height:1.6;margin:0 0 20px;max-width:62ch}
@media (max-width:800px){.sv-text{grid-template-columns:1fr}}
.hangfig{background:var(--soft);padding:26px;display:inline-block}
.hang-plan{position:relative}
.hang-plan button{position:absolute;overflow:hidden;background:var(--line)}
.hang-plan button img{width:100%;height:100%;object-fit:cover}
.hang-plan .n{position:absolute;left:3px;top:3px;font-size:10px;background:#fff;padding:0 4px}
.scale{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--grey)}
.scale i{display:block;height:5px;border:1px solid var(--grey);border-top:0}

/* artwork page */
.aw{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:clamp(30px,5vw,90px);padding-block:30px 90px;align-items:start}
.aw .pic{background:var(--soft);display:grid;place-items:center;padding:clamp(24px,5vw,80px);min-height:min(78vh,820px);cursor:zoom-in}
.aw .pic img{max-height:min(68vh,720px);width:auto;box-shadow:0 2px 4px rgba(0,0,0,.1),0 20px 40px -18px rgba(0,0,0,.4)}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:76px;height:76px;background:var(--soft);overflow:hidden;opacity:.6;border:1px solid transparent}
.thumbs button[aria-current="true"]{opacity:1;border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{position:sticky;top:100px;display:grid;gap:26px}
.info .who{font-size:20px}
.info .tt{font-size:clamp(28px,2.6vw,38px);line-height:1.15;font-style:italic}
.info dl{display:grid;gap:4px;margin:0;font-size:16px}
.info dd{margin:0}
.info .desc{font-size:17px;line-height:1.6;margin:0}
.info .price{font-size:26px}
.info .note{font-size:14px;color:var(--grey);margin:0;line-height:1.5}
.info .acts{display:grid;gap:10px}
.pn{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:18px}
.pn button:hover{color:var(--grey)}
@media (max-width:900px){.aw{grid-template-columns:1fr}.aw .pic{min-height:0}.aw .pic img{max-height:62vh}.info{position:static}}

/* about */
.ab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(30px,5vw,90px);padding-block:20px 90px;align-items:start}
.ab .ims{display:grid;gap:16px}
.ab .ims img{width:100%;object-fit:cover}
.ab .txt p{font-size:clamp(18px,1.4vw,20px);line-height:1.65;margin:0 0 22px;max-width:62ch}
.ab .q{font-size:clamp(24px,2.3vw,32px);line-height:1.3;margin:0 0 34px}
.facts2{display:grid;grid-template-columns:1fr 1fr;gap:30px;border-top:1px solid var(--line);padding-top:28px;margin-top:20px;font-size:16px}
.facts2 ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.facts2 a{border-bottom:1px solid var(--line)}
.facts2 a:hover{border-color:var(--ink)}
.copy{font-size:13px;border:1px solid var(--line);padding:3px 10px;margin-left:8px}
@media (max-width:860px){.ab{grid-template-columns:1fr}.facts2{grid-template-columns:1fr}}

/* legal (reuses renderLegal markup) */
.lhead{display:grid;gap:18px;padding:clamp(40px,5vw,80px) var(--gr) 30px var(--gl);max-width:1680px;margin:0 auto}
.lhead .t{font-size:clamp(32px,3.6vw,48px);line-height:1.12}
.lnav{display:flex;gap:28px;flex-wrap:wrap;font-size:15px;border-bottom:1px solid var(--line)}
.lnav a{padding:12px 0;color:var(--grey);border-bottom:1px solid transparent;margin-bottom:-1px}
.lnav a.on,.lnav a:hover{color:var(--ink);border-color:var(--ink)}
.lbody{display:grid;gap:34px;max-width:760px;padding:20px var(--gr) 110px var(--gl);margin-left:max(0px,calc((100vw - 1680px)/2))}
.lbody .ui{font-size:14px}
.lbody h3{margin:0 0 10px;font-size:20px;font-weight:500}
.lt{font-size:17px;line-height:1.7}
.lt a{border-bottom:1px solid currentColor}
.lt ol,.lt ul{margin:8px 0 0;padding-left:22px;display:grid;gap:6px}
.formbox{border:1px solid var(--line);background:var(--soft);padding:20px;font-size:15px}
.todo{background:#FFF1A8;padding:0 3px}

/* footer */
footer.ft{border-top:1px solid var(--line);margin-top:0}
footer.ft .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:30px;padding-block:56px 40px;font-size:15px}
footer.ft h4{margin:0 0 12px;font-weight:500;color:var(--grey);font-size:14px}
footer.ft ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
footer.ft a:hover{color:var(--grey)}
footer.ft .bottom{grid-column:1/-1;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--grey);border-top:1px solid var(--line);padding-top:22px;margin-top:18px}
@media (max-width:800px){footer.ft .wrap{grid-template-columns:1fr 1fr}}

/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.98);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) var(--gr) max(24px,env(safe-area-inset-bottom,0px)) var(--gl);cursor:zoom-out}
#lb img{max-width:100%;max-height:calc(100vh - 70px);width:auto;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
#lb .x{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));right:var(--gr);font-size:15px}

/* cart drawer (markup from the shop module) */
#scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.3)}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(480px,100%);background:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;border-bottom:1px solid var(--line)}
#drawer .dh .t{font-size:24px}
#drawer .dh .ui{font-size:15px}
#drawer .db{overflow-y:auto;flex:1;padding:18px 28px 34px}
#drawer .ui{font-size:13px}
.steps{display:flex;gap:16px;padding:0 0 16px;color:#A0A0A0;font-size:13px}.steps .on{color:var(--ink)}
.it{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.it img{width:72px;height:72px;object-fit:cover}
.it .t{font-size:17px}
.it .s{font-size:14px;color:var(--grey)}
.it .rm{margin-top:4px;color:var(--grey);font-size:13px;border-bottom:1px solid currentColor}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 4px}
.sum .t{font-size:24px}
.sum.sub{padding-top:2px}
.fine{font-size:14px;color:var(--grey);margin:0 0 22px;line-height:1.5}
form.req{display:grid;gap:14px}
form.req label{display:grid;gap:6px;font-size:13px;color:var(--grey)}
form.req .grp{margin-top:10px;padding-top:14px;border-top:1px solid var(--line);color:var(--ink);font-size:15px}
form.req input,form.req textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #CFCFCF;border-radius:0;padding:13px 14px;width:100%}
form.req input:focus,form.req textarea:focus{outline:none;border-color:var(--ink)}
form.req .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){form.req .two{grid-template-columns:1fr}}
form.req label.radio{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);color:var(--ink);font-size:15px;cursor:pointer}
form.req .radio input,form.req .check input{width:auto;padding:0;margin:3px 0 0;flex:none;accent-color:#000}
.radio small{color:var(--grey);font-size:13px}
form.req label.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);margin-top:4px}
form.req .check a{border-bottom:1px solid currentColor}
.btn-o{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border:1px solid var(--ink);font-size:15px}
.btn-o:hover{background:var(--soft)}
.btn-f{background:var(--ink);color:#fff}.btn-f:hover{background:#2B2B2B}
.btn-o[disabled]{opacity:.5}
.wide{width:100%}
.err{color:#B00020;font-size:14px;margin:0}
.empty{padding:30px 0;display:grid;gap:18px;justify-items:start}.empty p{margin:0;color:var(--grey)}
.done{display:grid;gap:14px}
.done pre{white-space:pre-wrap;font-family:var(--f);font-size:14px;margin:0;max-height:240px;overflow:auto;background:var(--soft);padding:14px}
.done .acts{display:flex;flex-wrap:wrap;gap:8px}
.inbox .rq{border-bottom:1px solid var(--line);padding:16px 0;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:#000;color:#fff;padding:12px 20px;font-size:14px;max-width:calc(100% - 40px)}

/* layout fixes: let grid children shrink, contain artwork images */
.works > *,.cards > *,.aw > *,.sv-text > *,.ab > *,.split > *,.cap > *{min-width:0}
.wk .im{position:relative;display:block;padding:0}
.wk .im img{position:absolute;left:11%;top:11%;width:78%;height:78%;max-height:none;object-fit:contain;box-shadow:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.22)) drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.aw .pic{width:100%}
.aw .pic img{max-width:100%;height:auto}
.hangfig{max-width:100%;overflow-x:auto}
@media (max-width:640px){.cap{grid-template-columns:1fr}.cap .arrows{order:-1}.count{text-align:left}}
</style>

<header class="hd">
  <div class="wrap">
    <a class="logo" href="#home" data-go="home">IO NATALL&amp;A</a>
    <nav class="c4" aria-label="Main">
      <a class="hm" href="#works" data-go="works" id="n-works">Artworks</a>
      <a class="hm" href="#series" data-go="series" id="n-series">Series</a>
      <a class="hm" href="#about" data-go="about" id="n-about">About</a>
      <a class="hm" href="#contact" data-go="contact">Contact</a>
      <button id="bagBtn" class="num">Cart (<span id="bagCount">0</span>)</button>
      <button class="menu-btn" id="menuBtn" aria-expanded="false">Menu</button>
    </nav>
  </div>
</header>
<div id="mmenu" hidden>
  <button class="x" id="menuClose">Close</button>
  <a href="#works" data-go="works">Artworks</a>
  <a href="#series" data-go="series">Series</a>
  <a href="#about" data-go="about">About</a>
  <a href="#contact" data-go="contact">Contact</a>
  <button id="bagBtn2" class="num">Cart (<span id="bagCount2">0</span>)</button>
</div>

<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-works"></section>
  <section class="view" id="v-serieslist"></section>
  <section class="view" id="v-series"></section>
  <section class="view" id="v-work"></section>
  <section class="view" id="v-about"></section>
  <section class="view" id="v-legal"></section>
</main>

<div id="lb" hidden><button class="x">Close</button><img alt=""></div>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Cart" role="dialog" aria-modal="true"></aside>
<div id="toast" hidden role="status"></div>

<script>
const ARTIST_EMAIL = "ionatalla.art@gmail.com";
const SERIES = [
 {id:"landscapes-of-freedom", added:"2026-07-29", title:"Landscapes of Freedom", kind:"Triptych",
  short:"Freedom as an inner state, reached through peace, balance and silence.",
  statement:[
   "Freedom rarely arrives suddenly. It emerges through inner harmony, through the ability to remain grounded while sharing life with another person, and through liberation from fear and illusion.",
   "The series can be read in both directions. From left to right it is a journey toward freedom through peace, balance and silence; from right to left it is a return to the world after liberation from fear and illusion. It forms a cycle rather than a linear story."],
  technique:"Acrylic and watercolour on canvas", w:50, h:50, price:3975, status:"available",
  hang:{cols:3, order:"ltr", gap:5, reading:"In either direction: left to right, or right to left", size:"160 × 50 cm", both:true}, wall:"lf-wall", extras:[],
  works:[

function hangPlan(s){
  if (!s.hang) return "";
  const H=s.hang, n=count(s), cols=H.cols, rows=Math.ceil(n/cols), g=H.gap;
  const W=cols*s.w+(cols-1)*g, HH=rows*s.h+(rows-1)*g, k=Math.min(300/W, 300/HH);
  let cells="";
  for (let i=0;i<n;i++){
    let r=Math.floor(i/cols), c=i%cols; if (H.order==="btt-ltr") r=rows-1-r;
    const w = s.diptychOneImage ? s.works[0] : s.works[i];
    const lab = s.diptychOneImage ? ["I","II"][i] : (w.n || i+1);
    cells += `<button data-work="${w.id}" style="left:${c*(s.w+g)*k}px;top:${r*(s.h+g)*k}px;width:${s.w*k}px;height:${s.h*k}px" aria-label="${esc(w.title)}">${s.diptychOneImage&&i===1?"":`<img src="img/${w.img}-s.jpg" alt="" loading="lazy">`}<span class="n">${esc(lab)}</span></button>`;
  }
  const sc = W>=150?50:W>=60?20:10;
  return `<div class="hangfig"><div class="hang-plan" style="width:${W*k}px;height:${HH*k}px">${cells}</div><div class="scale num"><i style="width:${sc*k}px"></i>${sc} cm · installation view, to scale</div></div>`;
}

      <button class="btn-o btn-f wide" type="submit" id="sendBtn">Send question to the artist</button>
      <p class="fine" style="margin:0">This is a question, not an order. The artist replies by email. See the <a href="#privacy" data-go="privacy" style="text-decoration:underline">Privacy Policy</a> for how your details are used.</p>
    </form>`);
}
function renderDone(st){
  const fallback = !st.saved;
  drawerShell(st.kind==="order" ? "Order" : "Question", `
    ${st.kind==="order" ? `<div class="steps ui"><span>1 Cart</span><span>2 Details</span><span class="on">3 Confirmation</span></div>` : ""}
    <div class="done">
      <div class="t" style="font-size:24px">${st.kind==="order" ? (fallback ? "Your order is ready to send" : "Thank you, your purchase request is sent") : (fallback ? "Your question is ready to send" : "Your question has been sent")}</div>
      ${st.kind==="order" ? `<div class="ui num">Order ${esc(st.no)}</div>` : ""}
      <p style="margin:0">${fallback
        ? `Send this text to <b>${ARTIST_EMAIL}</b> by email, or as an Instagram message to @io_natalla.`
        : st.kind==="order"
          ? `IO NATALL&amp;A will send the price, availability and shipping cost by email to <b>${esc(st.email)}</b>, then send your ${esc(st.pay==="Bank transfer"?"invoice":"secure payment link")}.`
          : `IO NATALL&amp;A will reply to <b>${esc(st.email)}</b>.`}</p>
      <pre id="orderPre">${esc(st.text)}</pre>
      <div class="acts"><button class="btn-o" id="copyOrder">Copy text</button>${fallback?`<button class="btn-o" data-copy="${ARTIST_EMAIL}">Copy email</button><a class="btn-o btn-f" href="mailto:${ARTIST_EMAIL}?subject=${encodeURIComponent((st.kind==="order"?"Order ":"Question — ")+(st.no||"IO NATALL&A"))}&body=${encodeURIComponent(st.text)}">Open in email app</a>`:""}</div>
    </div>`);
}
function openDrawer(state){ renderDrawer(state); $("#drawer").hidden=false; $("#scrim").hidden=false; $("#drawer .db") && ($("#drawer .db").scrollTop=0); }
function closeDrawer(){ $("#drawer").hidden=true; $("#scrim").hidden=true; }
function openEnquiry(kind, id){ enquiryFor={kind,id}; openDrawer({view:"enquiry"}); }

/* orders and questions are saved to the artist's private inbox when the page can, otherwise prepared to send */
let dbP=null, userP=null;
function caps(){
  if (!window.claude || !window.claude.use) return Promise.resolve([null,null]);
  dbP = dbP || window.claude.use("db").catch(()=>null);
  userP = userP || window.claude.use("user").catch(()=>null);
  return Promise.all([dbP,userP]);
}
const FORM_ENDPOINT = "https://formsubmit.co/ajax/" + ARTIST_EMAIL;  /* delivers orders and questions to the artist's inbox on the live site */
async function sendByForm(rec, text){
  try {
    const subject = rec.kind==="order" ? `New purchase request ${rec.no} — IO NATALL&A` : `Question about ${rec.about.title} — IO NATALL&A`;
    const r = await fetch(FORM_ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({_subject:subject, _template:"box", _captcha:"false", _replyto:rec.email, Type:rec.kind==="order"?"Order":"Question", Name:rec.name, Email:rec.email, Details:text})});
    if (!r.ok) return false;
    const j = await r.json().catch(()=>({}));
    return j.success===true || j.success==="true";
  } catch(e){ return false; }
}
async function saveRecord(rec, text){
  if (await saveToDb(rec)) return true;
  return await sendByForm(rec, text);
}
async function saveToDb(rec){
  try {
    const [db,user] = await Promise.race([caps(), new Promise(r=>setTimeout(()=>r([null,null]),4000))]);
    const uid = user && await user.id();
    if (!db || !uid) return false;
    const ref = db.doc("orders/"+uid), snap = await ref.get();
    const prev = (snap.exists && snap.data().requests) || [];
    prev.push(rec);
    await ref.set({requests:prev.slice(-30), updated:new Date().toISOString()});
    return true;
  } catch(e){ return false; }
}
const validEmail = v => /^\S+@\S+\.\S+$/.test(v||"");
async function submitOrder(form){
  const f = Object.fromEntries(new FormData(form).entries()), err=$("#formErr");
  const missing = ["name","email","address","city","zip","country"].filter(k => !(f[k]||"").trim());
  if (missing.length || !validEmail(f.email)){ err.textContent = "Please fill in your name, a valid email and the full delivery address."; err.hidden=false; return; }
  if (f.terms!=="yes"){ err.textContent = "Please confirm that you agree to the Terms of Sale."; err.hidden=false; return; }
  err.hidden=true; const btn=$("#sendBtn"); btn.disabled=true; btn.textContent="Placing order…";
  const no = orderNo(), total = cartTotal();
  const items = cart.map(it=>{ const v=itemView(it); return {type:it.type,id:it.id,title:v.t,detail:v.s,price:v.amount}; });
  const text = `ORDER ${no}\n\n${items.map(i=>`• ${i.title} (${i.detail}) `).join("\n")}\n\nPrice: upon request (please send price and shipping)\nPayment: ${f.pay}\n\n${f.name}\n${f.address}\n${f.zip} ${f.city}\n${f.country}\n${f.email}${f.phone?"\n"+f.phone:""}${f.note?"\n\nNote: "+f.note:""}`;
  const saved = await saveRecord({kind:"order", no, at:new Date().toISOString(), name:f.name, email:f.email, phone:f.phone||"", address:f.address, city:f.city, zip:f.zip, country:f.country, pay:f.pay, note:f.note||"", total, items}, text);
  if (saved){ cart=[]; saveCart(); }
  openDrawer({view:"done", kind:"order", saved, text, email:f.email, no, pay:f.pay});
}
async function submitEnquiry(form){
  const f = Object.fromEntries(new FormData(form).entries()), err=$("#formErr");
  if (!f.name.trim() || !validEmail(f.email) || !f.message.trim()){ err.textContent="Please add your name, a valid email and your question."; err.hidden=false; return; }
  err.hidden=true; const btn=$("#sendBtn"); btn.disabled=true; btn.textContent="Sending…";
  const e = enquiryFor, title = e.kind==="series" ? BY_SERIES[e.id].title : BY_WORK[e.id].title;
  const text = `QUESTION about ${title}\n\n${f.message}\n\n${f.name}${f.country?" · "+f.country:""}\n${f.email}`;
  const saved = await saveRecord({kind:"enquiry", at:new Date().toISOString(), name:f.name, email:f.email, country:f.country||"", message:f.message, about:{type:e.kind, id:e.id, title}}, text);
  openDrawer({view:"done", kind:"enquiry", saved, text, email:f.email});
}
async function initInbox(){
  const [db,user] = await caps(); if (!db||!user) return;
  let owner=false; try{ owner = await user.isOwner(); }catch(e){}
  if (!owner) return;
  const b=document.createElement("button"); b.textContent="Orders"; b.className="solid"; $(".hd .c4").appendChild(b);
  b.onclick = async () => {
    drawerShell("Orders & questions", `<div class="inbox"><p class="fine">Loading…</p></div>`);
    $("#drawer").hidden=false; $("#scrim").hidden=false;
    try {
      const q = await db.collection("orders").get();
      const reqs = q.docs.flatMap(d => d.data().requests||[]).sort((a,b)=>b.at.localeCompare(a.at));
      $(".inbox").innerHTML = reqs.length ? reqs.map(r => r.kind==="enquiry"
        ? `<div class="rq"><div class="ui" style="opacity:.75">Question · ${esc(new Date(r.at).toLocaleString())}</div><div><b>${esc(r.name)}</b>${r.country?" · "+esc(r.country):""} · ${esc(r.email)}</div><div style="margin-top:4px">About <b>${esc(r.about&&r.about.title||"")}</b></div><div style="color:#555;margin-top:4px">“${esc(r.message)}”</div></div>`
        : `<div class="rq"><div class="ui" style="opacity:.75">${r.no?"Order "+esc(r.no)+" · ":"Request · "}${esc(new Date(r.at).toLocaleString())}</div><div><b>${esc(r.name)}</b> · ${esc(r.email)}${r.phone?" · "+esc(r.phone):""}</div>${r.address?`<div style="color:#555">${esc(r.address)}, ${esc(r.zip)} ${esc(r.city)}, ${esc(r.country)}</div>`:`<div style="color:#555">${esc(r.country||"")}</div>`}<ul style="margin:6px 0;padding-left:18px">${(r.items||[]).map(i=>`<li>${esc(i.title)} — ${esc(i.detail)} · ${i.price?eur(i.price):"on request"}</li>`).join("")}</ul>${r.total?`<div><b>${eur(r.total)}</b> + shipping · ${esc(r.pay||"")}</div>`:""}${(r.note||r.message)?`<div style="color:#777">“${esc(r.note||r.message)}”</div>`:""}</div>`
      ).join("") : `<p class="fine">No orders or questions yet. They appear here when a collector sends one from this page.</p>`;
    } catch(e){ $(".inbox").innerHTML = `<p class="err">Orders could not be loaded. Reopen the page and try again.</p>`; }
  };
}



/* ---------- router ---------- */
let route = "";
function show(id){ $$(".view").forEach(v=>v.classList.toggle("on", v.id===id)); }
function nav(id){ ["n-works","n-series","n-about"].forEach(n=>$("#"+n).classList.toggle("on", n===id)); }
function go(hash, push=true){
  hash = hash || "home"; route = hash;
  closeMenu(); closeDrawer();
  if (hash.startsWith("work-") && BY_WORK[hash.slice(5)]){ renderWork(hash.slice(5)); show("v-work"); nav("n-works"); }
  else if (hash.startsWith("series-") && BY_SERIES[hash.slice(7)]){ renderSeries(hash.slice(7)); show("v-series"); nav("n-series"); }
  else if (hash==="works"){ renderWorks(); show("v-works"); nav("n-works"); }
  else if (hash==="series"){ renderSeriesList(); show("v-serieslist"); nav("n-series"); }
  else if (["terms","privacy","shipping"].includes(hash)){ renderLegal(hash); show("v-legal"); nav(""); }
  else if (hash==="about"||hash==="contact"){ renderAbout(); show("v-about"); nav("n-about"); }
  else { route="home"; show("v-home"); nav(""); }
  if (push){ try{ history.replaceState(null,"","#"+route); }catch(e){} }
  window.scrollTo(0,0);
  if (hash==="contact") setTimeout(()=>$("#contact") && $("#contact").scrollIntoView({behavior:"smooth"}), 80);
}
function closeMenu(){ $("#mmenu").hidden=true; $("#menuBtn").setAttribute("aria-expanded","false"); }
function openLB(id){ const lb=$("#lb"); $("img",lb).src=`img/${id}.jpg`; lb.hidden=false; }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if (e.target.id==="scrim"){ closeDrawer(); return; }
  if (e.target.closest("#lb")){ $("#lb").hidden=true; return; }
  const t = e.target.closest("a,button"); if (!t) return;
  const d = t.dataset;
  if (d.work){ e.preventDefault(); go("work-"+d.work); return; }
  if (d.series){ e.preventDefault(); go("series-"+d.series); return; }
  if (d.closeDrawer!==undefined){ closeDrawer(); if (d.go) go(d.go); return; }
  if (d.go){ e.preventDefault(); go(d.go); return; }
  if (d.hero){ heroTo(hi + (+d.hero)); clearInterval(hTimer); return; }
  if (d.filter){ wFilter=d.filter; renderWorks(); return; }
  if (d.thumb){ $("#picImg").src=`img/${d.thumb}.jpg`; $("#pic").dataset.lb=d.thumb; $$(".thumbs button").forEach(b=>b.setAttribute("aria-current", b===t)); return; }
  if (d.lb){ openLB(d.lb); return; }
  if (d.addSeries){ addItem("series", d.addSeries); return; }
  if (d.addWork){ addItem("work", d.addWork); return; }
  if (d.enqWork){ openEnquiry("work", d.enqWork); return; }
  if (d.enqSeries){ openEnquiry("series", d.enqSeries); return; }
  if (d.view){ openDrawer({view:d.view}); return; }
  if (d.rm!==undefined){ cart.splice(+d.rm,1); saveCart(); renderDrawer({view:"cart"}); return; }
  if (d.copy){ copyText(d.copy, t); return; }
  if (t.id==="copyOrder"){ copyText($("#orderPre").textContent, t); return; }
  if (t.id==="bagBtn"||t.id==="bagBtn2"){ closeMenu(); openDrawer({view:"cart"}); return; }
  if (t.id==="menuBtn"){ $("#mmenu").hidden=false; t.setAttribute("aria-expanded","true"); return; }
  if (t.id==="menuClose"){ closeMenu(); return; }
});
document.addEventListener("submit", e => { if (e.target.id==="orderForm"){ e.preventDefault(); submitOrder(e.target); } if (e.target.id==="enqForm"){ e.preventDefault(); submitEnquiry(e.target); } });
document.addEventListener("keydown", e => {
  if (e.key==="Escape"){ if(!$("#lb").hidden) $("#lb").hidden=true; else if(!$("#drawer").hidden) closeDrawer(); else closeMenu(); return; }
  if (e.target.closest("input,textarea")) return;
  if (route==="home" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ heroTo(hi+(e.key==="ArrowRight"?1:-1)); clearInterval(hTimer); }
  if (route.startsWith("work-") && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ const w=BY_WORK[route.slice(5)]; const n=w.series.works[w.i+(e.key==="ArrowRight"?1:-1)]; if(n) go("work-"+n.id); }
});
window.addEventListener("hashchange", () => { const h=(location.hash||"").slice(1); if (h && h!==route) go(h,false); });

buildHome(); updateCount();
(function(){ const h=(location.hash||"").slice(1); go(h||"home", false); if (h==="cart"||h==="collection") openDrawer({view:"cart"}); })();
initInbox();
</script>
</body></html>
